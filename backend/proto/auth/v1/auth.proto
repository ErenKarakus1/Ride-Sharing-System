syntax = "proto3";

package auth.v1;

option go_package = "github.com/ErenKarakus1/Ride-Sharing-System/backend/proto/gen/go/auth/v1;authv1";

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  string role = 4;
}
