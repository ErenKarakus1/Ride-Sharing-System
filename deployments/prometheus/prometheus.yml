global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8088"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: user-service
    static_configs:
      - targets: ["user-service:8080"]

  - job_name: ride-service
    static_configs:
      - targets: ["ride-service:8082"]

  - job_name: location-service
    static_configs:
      - targets: ["location-service:8083"]

  - job_name: matching-service
    static_configs:
      - targets: ["matching-service:8084"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8085"]

  - job_name: pricing-service
    static_configs:
      - targets: ["pricing-service:8086"]

  - job_name: payment-service
    static_configs:
      - targets: ["payment-service:8087"]
