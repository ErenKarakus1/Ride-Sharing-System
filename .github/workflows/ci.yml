name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            backend/**/go.sum
            tools/**/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend modules
        working-directory: tools/test-all
        run: go run .

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test frontend in browser
        working-directory: frontend
        run: npm run e2e

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml config

      - name: Start app stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build -d frontend

      - name: Smoke check backend stack
        working-directory: tools/smoke
        run: go run .

      - name: Run gateway e2e flow
        working-directory: tools/e2e
        run: go run .

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=200

      - name: Stop backend stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
