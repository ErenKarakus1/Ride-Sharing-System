name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            backend/**/go.sum
            tools/**/go.sum

      - name: Test proto module
        working-directory: backend/proto/gen/go
        run: go test ./...

      - name: Test api-gateway
        working-directory: backend/api-gateway
        run: go test ./...

      - name: Test auth-service
        working-directory: backend/auth-service
        run: go test ./...

      - name: Test user-service
        working-directory: backend/user-service
        run: go test ./...

      - name: Test ride-service
        working-directory: backend/ride-service
        run: go test ./...

      - name: Test location-service
        working-directory: backend/location-service
        run: go test ./...

      - name: Test matching-service
        working-directory: backend/matching-service
        run: go test ./...

      - name: Test notification-service
        working-directory: backend/notification-service
        run: go test ./...

      - name: Test pricing-service
        working-directory: backend/pricing-service
        run: go test ./...

      - name: Test payment-service
        working-directory: backend/payment-service
        run: go test ./...

      - name: Run backend test tool
        working-directory: tools/test-all
        run: go run .

      - name: Validate Docker Compose
        run: docker compose config
