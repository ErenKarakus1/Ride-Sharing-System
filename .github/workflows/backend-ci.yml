name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            backend/**/go.sum
            tools/**/go.sum

      - name: Test backend modules
        working-directory: tools/test-all
        run: go run .

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start backend stack
        run: docker compose up --build -d

      - name: Smoke check backend stack
        working-directory: tools/smoke
        run: go run .

      - name: Run gateway e2e flow
        working-directory: tools/e2e
        run: go run .

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop backend stack
        if: always()
        run: docker compose down -v
