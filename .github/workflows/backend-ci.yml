name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            backend/**/go.sum
            tools/**/go.sum

      - name: Test backend modules
        working-directory: tools/test-all
        run: go run .

      - name: Validate Docker Compose
        run: docker compose config
