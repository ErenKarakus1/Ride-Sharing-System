services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_USER: rideshare
      POSTGRES_PASSWORD: rideshare
      POSTGRES_DB: rideshare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideshare -d rideshare"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    environment:
      HTTP_PORT: 8080
      GRPC_PORT: 9091
      DATABASE_URL: postgres://rideshare:rideshare@postgres:5432/rideshare?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"
      - "9091:9091"

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    environment:
      HTTP_PORT: 8081
      GRPC_PORT: 9092
      DATABASE_URL: postgres://rideshare:rideshare@postgres:5432/rideshare?sslmode=disable
      JWT_SECRET: local-development-secret
      USER_SERVICE_GRPC_ADDR: user-service:9091
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8081:8081"

  ride-service:
    build:
      context: .
      dockerfile: backend/ride-service/Dockerfile
    environment:
      HTTP_PORT: 8082
      GRPC_PORT: 9093
      DATABASE_URL: postgres://rideshare:rideshare@postgres:5432/rideshare?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      INTERNAL_SERVICE_TOKEN: local-internal-service-token
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8082:8082"
      - "9093:9093"

  location-service:
    build:
      context: .
      dockerfile: backend/location-service/Dockerfile
    environment:
      PORT: 8083
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8083:8083"

  matching-service:
    build:
      context: .
      dockerfile: backend/matching-service/Dockerfile
    environment:
      PORT: 8084
      LOCATION_SERVICE_HTTP_URL: http://location-service:8083
    depends_on:
      location-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8084:8084"

  notification-service:
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
    environment:
      PORT: 8085
      KAFKA_BROKERS: kafka:9092
      AUTH_SERVICE_GRPC_ADDR: auth-service:9092
      WS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8085:8085"

  pricing-service:
    build:
      context: .
      dockerfile: backend/pricing-service/Dockerfile
    environment:
      PORT: 8086
    ports:
      - "8086:8086"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: .
      dockerfile: backend/payment-service/Dockerfile
    environment:
      PORT: 8087
      DATABASE_URL: postgres://rideshare:rideshare@postgres:5432/rideshare?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      RIDE_SERVICE_GRPC_ADDR: ride-service:9093
      INTERNAL_SERVICE_TOKEN: local-internal-service-token
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ride-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8087:8087"

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    environment:
      PORT: 8088
      AUTH_SERVICE_GRPC_ADDR: auth-service:9092
      AUTH_SERVICE_HTTP_URL: http://auth-service:8081
      USER_SERVICE_HTTP_URL: http://user-service:8080
      RIDE_SERVICE_HTTP_URL: http://ride-service:8082
      LOCATION_SERVICE_HTTP_URL: http://location-service:8083
      MATCHING_SERVICE_HTTP_URL: http://matching-service:8084
      NOTIFICATION_SERVICE_HTTP_URL: http://notification-service:8085
      PRICING_SERVICE_HTTP_URL: http://pricing-service:8086
      PAYMENT_SERVICE_HTTP_URL: http://payment-service:8087
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      ride-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8088:8088"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8088
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-gateway
      - auth-service
      - user-service
      - ride-service
      - location-service
      - matching-service
      - notification-service
      - pricing-service
      - payment-service
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  grafana-data:
